# Build, test, and quality gates.
#
# Design notes:
#   * `dotnet test` uses the Microsoft.Testing.Platform (MTP) syntax. MTP is opted into in
#     global.json ("test": { "runner": "Microsoft.Testing.Platform" }), and in MTP mode the
#     solution is passed as `--solution <path>`, never as a bare positional argument.
#   * `fetch-depth: 0` is required: MinVer walks the tag history to derive the package version,
#     and SourceLink needs the commit metadata.
#   * `CI: 'true'` is what turns on `ContinuousIntegrationBuild` in Directory.Build.props, which
#     in turn enables deterministic, path-mapped builds. It also turns on `RestoreLockedMode`, so
#     every `dotnet restore` below restores exactly the graph recorded in packages.lock.json.
#   * Every `uses:` is pinned to a commit SHA, with the tag it came from in a trailing comment.
#     A tag is mutable and an action runs with this repository's token; Dependabot moves the pins
#     and the comments forward.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

# Superseded runs on the same ref are worthless, so cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release
  # Consumed by Directory.Build.props to switch on ContinuousIntegrationBuild.
  CI: 'true'
  ContinuousIntegrationBuild: 'true'

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # See every failing leg, not just the first one to fail.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # MinVer and SourceLink need the full history and the tags.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          # 10.0.x is the SDK that global.json pins and that builds every project. 8.0.x is listed
          # as well because the test project multi-targets net8.0;net10.0 and its tests are
          # executed, not just compiled, so the .NET 8 runtime has to be present. A runtime that
          # merely happens to be preinstalled on the runner is not visible once setup-dotnet
          # points DOTNET_ROOT at its own tool cache.
          dotnet-version: |
            10.0.x
            8.0.x
          # The cache key is the lock files. They pin the entire transitive graph, so they change
          # exactly when the restored packages change, which is what a cache key needs to track:
          # the CPM version list and the project files only decide the graph indirectly.
          # Directory.Packages.props is listed as well so that a dependency change invalidates the
          # cache on the first run, rather than serving a cache built from the old graph only for
          # the locked restore below to reject it.
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json

      # Restore is locked on CI: RestoreLockedMode follows CI=true in Directory.Build.props, so a
      # dependency change that was not accompanied by regenerated lock files fails here with NU1004
      # instead of restoring a different graph than the one that was reviewed. See CONTRIBUTING.md
      # for how to regenerate them.
      - name: Restore
        run: dotnet restore TypeSafe.slnx

      - name: Build
        run: dotnet build TypeSafe.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test --solution TypeSafe.slnx
          -c ${{ env.CONFIGURATION }}
          --no-build
          --coverage
          --coverage-output-format cobertura
          --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**
          # A leg that failed before producing results should not mask the real failure.
          if-no-files-found: warn
          retention-days: 7

  # The coverage gate runs once, on the reports the Ubuntu leg produced, rather than in every leg:
  # the same code measured three times would give three verdicts and three comments, and the
  # platform that runs the tests does not change which lines of a library they execute.
  coverage:
    name: coverage gate
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to keep one summary comment updated on the pull request.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # No .NET setup: the gate reads cobertura XML and needs nothing else.
      - name: Download the Ubuntu coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: test-results-ubuntu-latest
          path: TestResults

      # Real thresholds, with room to move: line coverage sits near 83% and branch near 77%, and
      # the two shipping assemblies are gated individually so one of them cannot be carried by the
      # other. Raise these deliberately; lowering one is a decision worth explaining in the commit.
      - name: Check coverage thresholds
        run: |
          python3 eng/coverage-gate.py \
            --reports 'TestResults/**/*.cobertura.xml' \
            --line 80 \
            --branch 70 \
            --assembly TypeSafe.Sdk:78:70 \
            --assembly TypeSafe.Sdk.DependencyInjection:90:90 \
            --markdown coverage-summary.md

      # Runs even when the gate failed, so the numbers that caused the failure are on the run page
      # and not only in the job log. When the gate could not measure anything there is no summary
      # to show, and the run page says so rather than staying silent.
      - name: Add the summary to the run
        if: always()
        run: |
          if [[ -f coverage-summary.md ]]; then
            cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Code coverage"
              echo
              echo "Coverage could not be measured; see the \`Check coverage thresholds\` step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # One comment per pull request, edited in place rather than appended to on every push. The
      # marker is what identifies our comment, so a stale-bot comment (same author) is never
      # overwritten by accident. Fork pull requests get a read-only token, so they keep the job
      # summary and skip the comment instead of failing on a permission error.
      - name: Update the pull request comment
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('coverage-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          jq -Rs '{body: .}' coverage-summary.md > comment.json

          # `--paginate` runs the filter once per page and concatenates the output, so the filter
          # emits one id per line and `tail` takes the most recent match - comments come back
          # oldest first. Piping this through `--jq 'last'` instead would pick the last match on
          # each page, which is a different comment once a pull request has more than one page.
          existing="$(
            gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- coverage-gate -->")) | .id' \
              | tail -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              --input comment.json > /dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" \
              --input comment.json > /dev/null
          fi

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json

      - name: Restore
        run: dotnet restore TypeSafe.slnx

      # Exits 2 when any file would be reformatted, 1 on an error, 0 when clean.
      - name: Verify formatting
        run: dotnet format TypeSafe.slnx --verify-no-changes --no-restore

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to publish findings to the repository's Security tab.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # A full history is required: the scan covers every commit, not just the tip, so a key
          # that was committed and later removed is still caught.
          fetch-depth: 0

      # An SDK that reads API keys should not be the thing that leaks one. GitHub's own secret
      # scanning covers public repositories, but it only looks at the tip, and this runs before
      # review rather than after.
      #
      # The gitleaks CLI is invoked directly rather than through gitleaks/gitleaks-action. The
      # action derives its scan range from the event as `<pushed-range-start>^..<head>`, and the
      # `^` is invalid when that range starts at the repository's root commit - which is exactly
      # what the first push to an empty repository looks like. It then fails with "ambiguous
      # argument" and reports no leaks, so it fails open on the one push where it matters most.
      # The action also validates its licence against a third-party service; the CLI does not, and
      # gitleaks itself is MIT.
      - name: Scan for secrets
        env:
          # Bump deliberately. Pinning keeps a new upstream release from changing what this gate
          # reports without a commit here.
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" != "Linux" ]]; then
            echo "::error::This step is written for the Linux runner."
            exit 1
          fi

          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks

          # --log-opts=--all rather than a computed range, so the scan is the same on every event
          # and cannot be defeated by an unusual range. --redact keeps a detected secret out of the
          # log, and --exit-code 2 fails the step when something is found.
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 2

      # Runs even when the scan above failed, so a real finding lands in the Security tab instead
      # of only in the job log.
      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Configuration comes from .markdownlint-cli2.jsonc at the repository root, which is the
      # same file a local `npx markdownlint-cli2` run picks up.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24
        with:
          globs: '**/*.md'
